const bytes=Uint8Array.from(atob(inner),c=>c.charCodeAt(0));
const frame=$('beetle-engine');let core=null,ready=false,volume=75,boot=false;
frame.srcdoc=new TextDecoder().decode(bytes);
window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.beetleWorkbench==='ready')activate();});
frame.addEventListener('load',()=>setTimeout(activate,40));
function status(message){$('workbench-status').textContent=message;}
function activate(){try{core=frame.contentWindow?.BEETLE_WORKBENCH_BRIDGE;if(!core||ready)return;ready=true;
 $('screen-overlay').hidden=true;renderScreen();refreshSlots(true);setInterval(refreshState,250);status('BEETLE V1.3.3 READY');}
 catch(err){status('Emulator failed to initialize: '+err.message);}}
function call(name,...args){if(!core){status('Simulator still starting.');return null;}
 try{return core[name](...args);}catch(err){status('ERROR · '+err.message);console.error(err);return null;}}
function renderScreen(){if(!ready)return;try{const source=core.getCanvas(),canvas=$('sim-screen'),ctx=canvas.getContext('2d',{alpha:false});
 ctx.imageSmoothingEnabled=false;if(core.isBooting()){const splash=core.getSplash();if(splash?.complete&&splash.naturalWidth){ctx.drawImage(splash,0,0,240,240);}else ctx.drawImage(source,0,0);}else ctx.drawImage(source,0,0,240,240);
 }catch(err){}requestAnimationFrame(renderScreen);}
let lastSlotSignature='',lockedSlot=null;
function refreshSlots(selectActive=false){if(!core)return;try{const slots=core.listSlots();const signature=JSON.stringify(slots);
 const select=$('slot-select');const prior=select.value;
 if(lastSlotSignature!==signature){select.replaceChildren();for(const entry of slots){const opt=document.createElement('option');opt.value=String(entry.slot);opt.textContent=String(entry.slot+1).padStart(2,'0')+' · '+(entry.empty?'EMPTY':entry.name);select.append(opt);}lastSlotSignature=signature;}
 const active=core.state().slot;
 if(selectActive&&active!=null)select.value=String(active);
 else if(lockedSlot!==null)select.value=String(lockedSlot);
 else if(prior&&select.querySelector('option[value="'+prior+'"]'))select.value=prior;
 if(select.selectedIndex<0)select.value='0';
 }catch(err){console.warn('Slot refresh failed',err);}}
function refreshState(){if(!core)return;try{const state=core.state();$('current-project').textContent=state.project;
 $('project-note').textContent=(state.slot==null?'UNSAVED':'SLOT '+String(state.slot+1).padStart(2,'0'))+(state.dirty?' · MODIFIED':' · SAVED');
 const label=state.playing?'PLAYING':'STOPPED';
 if(!statusLockedUntil||Date.now()>statusLockedUntil){const st=state.status;if(st&&st!=='Idle')status(st);else status('PAT '+String(state.pattern).padStart(2,'0')+' · CH'+state.channel+' · BPM '+state.bpm+' · '+label);}
 if(state.slot!==null&&lockedSlot===null){const opt=$('slot-select');if(opt.value!==String(state.slot))opt.value=String(state.slot);}
 }catch(err){console.warn('State refresh failed',err);}}
let statusLockedUntil=0;
function notice(s){status(s);statusLockedUntil=Date.now()+3300;}
function result(response,message){if(response?.ok){refreshSlots(true);lockedSlot=null;notice(message||'PROJECT UPDATED');}else if(response?.cancelled)notice('CANCELLED');else notice('NO CHANGE');}
$('slot-select').addEventListener('change',()=>{lockedSlot=Number($('slot-select').value);});
$('new-btn').onclick=()=>{try{result(call('newSlot',Number($('slot-select').value)),'NEW PROJECT · PRESS SAVE TO STORE');}catch(err){notice(err.message);}};
$('load-btn').onclick=()=>result(call('loadSlot',Number($('slot-select').value)),'PROJECT LOADED');
$('save-btn').onclick=()=>{let name='';const s=core?.state();if(s&&(s.project==='UNTITLED'||s.project==='')){
 name=prompt('Project name (up to 12 characters):','PROJECT '+String(Number($('slot-select').value)+1).padStart(2,'0'));
 if(name===null)return;
 }result(call('saveSlot',Number($('slot-select').value),name),'PROJECT SAVED TO SLOT');};
$('import-btn').onclick=()=>{$('project-import-file').value='';$('project-import-file').click();};
$('project-import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file||!core)return;
 const target=Number($('slot-select').value);notice('READING '+file.name+'…');
 try{const resultObj=await core.importToSlot(file,target);result(resultObj,'IMPORTED '+file.name+' INTO SLOT '+String(target+1).padStart(2,'0'));}
 catch(err){notice('IMPORT FAILED · '+err.message);console.error('BEETLE import',err);}finally{e.target.value='';}});
$('export-btn').onclick=()=>{call('exportProject');notice('EXPORT REQUESTED · THE ACTIVE PROJECT WILL BE DOWNLOADED');};
const encoders=[['MASTER','volume',105,100],['SELECT','select',215,100],['PRESETS','preset',105,205],['ALGORITHM','algorithm',215,205],['KNOB 1','k1',610,100],['KNOB 2','k2',714,100],['KNOB 3','k3',818,100],['KNOB 4','k4',922,100]];
for(const [label,id,x,y] of encoders){const wrapper=document.createElement('div');wrapper.className='encoder';
 wrapper.style.left=(x/10)+'%';wrapper.style.top=(y/6.24)+'%';
 wrapper.innerHTML='<span>'+label+'</span><button class="dial" type="button" aria-label="'+label+' encoder" title="Scroll or drag vertically to rotate '+label+'"><i></i></button><div class="detents"><button type="button" aria-label="'+label+' decrease">−</button><button type="button" aria-label="'+label+' increase">+</button></div>';
 const dial=wrapper.querySelector('.dial');let lastY=0,dragged=false,angle=0;
 const turn=direction=>{if(id==='volume'){volume=Math.max(0,Math.min(100,volume+direction*3));call('volume',volume);}else call('rotate',id,direction);
  angle+=direction*16;dial.style.setProperty('--angle',angle+'deg');};
 const detents=wrapper.querySelectorAll('.detents button');detents[0].onclick=()=>turn(-1);detents[1].onclick=()=>turn(1);
 dial.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey)return;e.preventDefault();turn(e.deltaY<0?1:-1);},{passive:false});
 dial.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();lastY=e.clientY;dragged=false;dial.setPointerCapture(e.pointerId);});
 dial.addEventListener('pointermove',e=>{if(!dial.hasPointerCapture(e.pointerId))return;const dt=Math.trunc((lastY-e.clientY)/7);if(dt){lastY-=dt*7;dragged=true;for(let k=0;k<Math.min(25,Math.abs(dt));k++)turn(Math.sign(dt));}});
 dial.addEventListener('pointerup',e=>{if(!dragged)turn(e.shiftKey?-1:1);});
 dial.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();turn(e.key==='ArrowUp'||e.key==='ArrowRight'?1:-1);}});
 $('sim-device').appendChild(wrapper);
}
const buttons=[['OCT −','OCT-',60,258,90,34],['OCT ＋','OCT+',170,258,90,34]];
['FX','SEL','ENV','LFO','EDIT','GLO'].forEach((n,i)=>buttons.push([n,n,582+i*63,174,54,48]));
['HOME','SAVE','ARP','SEQ','PLAY','REC'].forEach((n,i)=>buttons.push([n,n,582+i*63,236,54,48]));
function installPress(element,action){let pressed=false;
 const down=e=>{if(e.button!=null&&e.button!==0)return;if(pressed)return;pressed=true;element.classList.add('held');
   if(e.pointerId!=null)try{element.setPointerCapture(e.pointerId);}catch(_){}
   call('press',action,true);};
 const up=()=>{if(!pressed)return;pressed=false;element.classList.remove('held');call('press',action,false);};
 element.addEventListener('pointerdown',down);element.addEventListener('pointerup',up);element.addEventListener('pointercancel',up);
 element.addEventListener('click',e=>{if(e.detail===0){call('press',action,true);call('press',action,false);}});
 element.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){if(!e.repeat)down({button:0});e.preventDefault();}});
 element.addEventListener('keyup',e=>{if(e.key==='Enter'||e.key===' ')up();});}
for(const [label,action,x,y,w,h] of buttons){const b=document.createElement('button');b.type='button';b.className='panel-button';b.dataset.button=action;
 b.title=label+' · Hold for combinations';b.setAttribute('aria-label',label);
 Object.assign(b.style,{left:x/10+'%',top:y/6.24+'%',width:w/10+'%',height:h/6.24+'%'});
 if(action==='PLAY')b.innerHTML='PLAY<small>STOP</small>';else b.textContent=label;
 installPress(b,action);$('sim-device').append(b);}
const whitePositions=[0,2,4,6,7,9,11,12,14,16,18,19,21,23,24,26],blackPositions=[1,3,5,8,10,13,15,17,20,22];
const labels=['OP1','OP2','OP3','OP4','OP5','OP6','AUX','GLOBAL','MONO','POLY'];
for(let key=0;key<27;key++){const wi=whitePositions.indexOf(key),ki=blackPositions.indexOf(key),b=document.createElement('button');
 const white=wi>=0;b.type='button';b.className='piano-key '+(white?'white':'black');
 const center=white?wi+.5:whitePositions.filter(k=>k<key).length;
 b.style.left=(center*100/16)+'%';b.innerHTML='<i></i><span>'+(white?String(wi+1).padStart(2,'0'):(labels[ki]||''))+'</span>';
 b.title=white?'White key '+(wi+1)+' · note or Punch-In FX':(ki>=0?'Black key '+(ki+1)+' · OP / channel mute controls':'Unused black key');
 let pressed=false;const release=()=>{if(!pressed)return;pressed=false;b.classList.remove('held');if(white)call('key',wi,false);};
 b.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();if(pressed)return;pressed=true;
  try{b.setPointerCapture(e.pointerId);}catch(_){}b.classList.add('held');if(white)call('key',wi,true);else if(ki<6)call('black',ki);});
 b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);
 b.addEventListener('click',e=>{if(e.detail===0){if(white){call('key',wi,true);call('key',wi,false);}else if(ki<6)call('black',ki);}});
 $('sim-keyboard').append(b);}
const lcd=$('sim-screen');lcd.addEventListener('click',e=>{if(!core)return;const rect=lcd.getBoundingClientRect();
 const x=(e.clientX-rect.left)/rect.width*240,y=(e.clientY-rect.top)/rect.height*240;call('screenClick',x,y,e.shiftKey);});
const keys={'KeyA':0,'KeyS':1,'KeyD':2,'KeyF':3,'KeyG':4,'KeyH':5,'KeyJ':6,'KeyK':7};
const pressedKeys=new Set();
window.addEventListener('keydown',e=>{const tag=e.target?.tagName;
 if(['INPUT','TEXTAREA','SELECT'].includes(tag)||e.ctrlKey||e.metaKey||e.altKey)return;
 if(keys[e.code]!=null){e.preventDefault();if(!pressedKeys.has(e.code)){pressedKeys.add(e.code);call('key',keys[e.code],true);}return;}
 if(e.repeat)return;
 if(e.code==='Space'){e.preventDefault();call('press','PLAY',false);}

 });
window.addEventListener('keyup',e=>{if(pressedKeys.has(e.code)){pressedKeys.delete(e.code);call('key',keys[e.code],false);}});
window.addEventListener('blur',()=>{for(const k of pressedKeys)call('key',keys[k],false);pressedKeys.clear();});
document.addEventListener('contextmenu',event=>event.preventDefault(),true);
document.addEventListener('selectstart',event=>event.preventDefault(),true);
document.addEventListener('dragstart',event=>{if(!(event.target instanceof HTMLInputElement))event.preventDefault();},true);
})();
</script></body></html>
